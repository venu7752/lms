name: Authentication, Authorization & Tenant Isolation Tests

on:
  workflow_dispatch:

jobs:
  auth-authz-tenant-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the report back into the repo
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run authentication / authorization / tenant isolation tests
        run: python scripts/auth_authz_tenant_test.py
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          JMITCHELL_USER: ${{ secrets.JMITCHELL_USERNAME }}
          JMITCHELL_PASS: ${{ secrets.JMITCHELL_PASSWORD }}
          PTEST_USER: ${{ secrets.PTEST_USERNAME }}
          PTEST_PASS: ${{ secrets.PTEST_PASSWORD }}
          LROGAHN_USER: ${{ secrets.LROGAHN_USERNAME }}
          LROGAHN_PASS: ${{ secrets.LROGAHN_PASSWORD }}
          REPORT_DIR: reports/auth-authz-tenant

      # Report is uploaded as a workflow artifact regardless of the commit step below
      - name: Upload report as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-authz-tenant-html-report
          path: reports/auth-authz-tenant/

      # Also commit the HTML report into the repo itself, so it's browsable
      # directly in GitHub without downloading an artifact.
      - name: Commit report to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/auth-authz-tenant/
          git diff --cached --quiet || git commit -m "chore: add auth/authz/tenant test report [skip ci]"
          git push
