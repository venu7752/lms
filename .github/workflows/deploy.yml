# Goal - To ensure my running application is free from OWASP top 10 security issues
name: OWASP ZAP DAST Scan

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Confirm target is reachable
        run: |
          timeout 60s sh -c 'until curl -s -o /dev/null -w "%{http_code}" "${{ secrets.TARGET_URL }}" | grep -qE "^[23]"; do sleep 2; done'

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ secrets.TARGET_URL }}
          fail_action: false
          allow_issue_writing: false
